<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caça-Anagramas WoW | Decifrador de Palavras</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        input:focus {
            outline: 2px solid #a855f7;
        }

        /* CSS NATIVO DE ALTA PRIORIDADE PARA A GRID DE RESULTADOS */
        .container-resultados-puro {
            display: block !important;
            width: 100% !important;
            margin-top: 15px !important;
        }

        .grid-resultados-puro {
            display: grid !important;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)) !important;
            gap: 10px !important;
            padding: 10px 0 !important;
            width: 100% !important;
        }

        .botao-palavra-puro {
            display: block !important;
            padding: 10px 6px !important;
            background-color: #f3f4f6 !important;
            border: 1px solid #e5e7eb !important;
            border-radius: 8px !important;
            color: #1f2937 !important;
            font-family: monospace !important;
            font-size: 15px !important;
            font-weight: bold !important;
            text-align: center !important;
            cursor: pointer !important;
            text-decoration: none !important;
            box-sizing: border-box !important;
            transition: all 0.2s ease;
        }

        .botao-palavra-puro:hover {
            background-color: #f3e8ff !important;
            color: #7e22ce !important;
            border-color: #d8b4fe !important;
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-slate-100 text-gray-800 font-sans min-h-screen relative">

    <div id="alerta-customizado" class="hidden fixed bottom-5 right-5 bg-slate-900 text-white p-4 rounded-xl shadow-2xl z-50 border border-slate-700 max-w-sm transition-all duration-300">
        <div class="flex flex-col gap-2">
            <p class="font-medium flex items-center gap-2 text-purple-400">
                📋 <span id="alerta-texto-copia">Palavra copiada!</span>
            </p>
            <p class="text-sm text-slate-300 border-t border-slate-700 pt-2">
                Significado no dicionário: 
                <a id="alerta-link-dicionario" href="#" target="_blank" class="text-purple-300 hover:text-purple-200 font-semibold underline inline-flex items-center gap-1">
                    Abrir Priberam 🔗
                </a>
            </p>
        </div>
    </div>

    <div class="max-w-3xl mx-auto px-4 py-8">
        
        <header class="mb-8 text-center border-b pb-6 border-slate-200">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-purple-700 mb-2 flex items-center justify-center gap-2">
                🔮 Caça-Anagramas WoW
            </h1>
            <p class="text-gray-600 font-medium">Decifre rodas de letras e encontre todas as combinações do Words of Wonders!</p>
        </header>

        <div class="bg-white rounded-2xl shadow-lg p-6 mb-8 border border-slate-100">
            <h2 class="text-lg font-semibold mb-4 text-gray-700 flex items-center gap-2">
                🎡 Digite as Letras da Roda
            </h2>

            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Dicionário / Idioma</label>
                    <select id="idioma" class="w-full p-2.5 border rounded-xl bg-slate-50 focus:bg-white transition text-sm">
                        <option value="pt">Português</option>
                        <option value="en">Inglês</option>
                        <option value="es">Espanhol</option>
                        <option value="fr">Francês</option>
                        <option value="it">Italiano</option>
                        <option value="de">Alemão</option>
                        <option value="nl">Nederlandês</option>
                        <option value="custom">Carregar Lista Própria (.txt)</option>
                    </select>

                    <div id="area-upload" class="hidden mt-2">
                        <input type="file" id="upload-file" accept=".txt" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100" />
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Letras Disponíveis</label>
                    <input type="text" id="letras-disponiveis" placeholder="Ex: amor (ou a-m-o-r)" class="w-full p-3 text-lg font-bold tracking-widest text-purple-800 uppercase border border-slate-300 rounded-xl bg-purple-50/30 focus:bg-white transition" autocomplete="off" autofocus />
                </div>

                <div class="flex items-center gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <input type="checkbox" id="permitir-repeticao" class="w-5 h-5 text-purple-600 rounded focus:ring-purple-500 cursor-pointer" />
                    <label for="permitir-repeticao" class="text-sm font-medium text-gray-700 cursor-pointer select-none">
                        Permitir repetição ilimitada das letras digitadas
                        <span class="block text-xs text-gray-500 font-normal">Desmarcado: Usa apenas a quantidade exata de cada letra informada na roda.</span>
                    </label>
                </div>

                <div class="flex justify-end gap-3 pt-2">
                    <button id="btn-limpar" class="px-5 py-2.5 border border-slate-300 rounded-xl text-gray-700 hover:bg-slate-100 transition font-medium text-sm">Limpar</button>
                    <button id="btn-buscar" class="px-6 py-2.5 bg-purple-600 text-white rounded-xl hover:bg-purple-700 transition font-medium text-sm shadow-md shadow-purple-200">Decifrar Palavras</button>
                </div>
            </div>
        </div>

        <div id="painel-resultados" class="bg-white rounded-2xl shadow-lg p-6">
            <div class="flex justify-between items-center mb-4 border-b pb-3 border-slate-100">
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">🏆 Combinacões Encontradas</h2>
                <span id="contador" class="bg-purple-100 text-purple-800 text-xs font-bold px-3 py-1.5 rounded-full">Aguardando busca...</span>
            </div>
            
            <div id="lista-resultados-agrupada" class="space-y-6"></div>
        </div>
    </div>

    <script>
        // Limite padrão configurável
        const LIMITE_PALAVRAS = 40000;

        const CONFIG_DICIONARIOS = {
            pt: { nome: "Português", arquivo: "pt.txt", dicionarioUrl: "https://dicionario.priberam.org/" },
            en: { nome: "Inglês", arquivo: "en.txt", dicionarioUrl: "https://www.dictionary.com/browse/" },
            es: { nome: "Espanhol", arquivo: "es.txt", dicionarioUrl: "https://dle.rae.es/" },
            fr: { nome: "Francês", arquivo: "fr.txt", dicionarioUrl: "https://www.larousse.fr/dictionnaires/francais/" },
            it: { nome: "Italiano", arquivo: "it.txt", dicionarioUrl: "https://translate.google.com/?sl=auto&tl=pt&text=" },
            de: { nome: "Alemão", arquivo: "de.txt", dicionarioUrl: "https://translate.google.com/?sl=auto&tl=pt&text=" },
            nl: { nome: "Nederlandês", arquivo: "nl.txt", dicionarioUrl: "https://translate.google.com/?sl=auto&tl=pt&text=" },
            custom: { nome: "Arquivo Próprio", arquivo: null, dicionarioUrl: "https://dicionario.priberam.org/" }
        };

        const cacheDicionarios = { custom: [] };
        let palavrasAtivas = [];
        let chaveDicionarioAtual = "pt"; 
        let timeoutAlerta;

        const elIdioma = document.getElementById('idioma');
        const elAreaUpload = document.getElementById('area-upload');
        const elUploadFile = document.getElementById('upload-file');
        const elLetrasDisponiveis = document.getElementById('letras-disponiveis');
        const elPermitirRepeticao = document.getElementById('permitir-repeticao');
        const elBtnLimpar = document.getElementById('btn-limpar');
        const elBtnBuscar = document.getElementById('btn-buscar');
        const elListaResultadosAgrupada = document.getElementById('lista-resultados-agrupada');
        const elContador = document.getElementById('contador');
        const elPainelResultados = document.getElementById('painel-resultados');

        function processarListaPalavras(arrayPalavras) {
            const unicas = [...new Set(arrayPalavras.map(p => p.trim().toLowerCase()).filter(Boolean))];
            return unicas.sort((a, b) => a.localeCompare(b, 'pt-BR'));
        }

        function atualizarMensagemListaCarregada(quantidade) {
            elContador.innerText = `Base pronta: ${quantidade} palavras`;
            elContador.className = 'bg-purple-100 text-purple-800 text-xs font-bold px-3 py-1.5 rounded-full';
        }

        async function carregarDicionario(chave) {
            chaveDicionarioAtual = chave;

            if (chave === 'custom') {
                palavrasAtivas = [...cacheDicionarios.custom];
                atualizarMensagemListaCarregada(palavrasAtivas.length);
                return;
            }

            if (cacheDicionarios[chave]) {
                palavrasAtivas = cacheDicionarios[chave];
                atualizarMensagemListaCarregada(palavrasAtivas.length);
                return;
            }

            const config = CONFIG_DICIONARIOS[chave];
            if (!config || !config.arquivo) return;

            elContador.innerText = `Carregando ${config.nome}...`;
            elContador.className = 'bg-yellow-100 text-yellow-800 text-xs font-bold px-3 py-1.5 rounded-full';

            try {
                const resposta = await fetch(config.arquivo);
                if (!resposta.ok) throw new Error(`Não foi possível carregar ${config.arquivo}`);

                const texto = await resposta.text();
                const linhas = texto.split(/[\r\n]+/).map(l => l.trim()).filter(Boolean);
                const linhasLimitadas = linhas.slice(0, LIMITE_PALAVRAS);
                
                cacheDicionarios[chave] = processarListaPalavras(linhasLimitadas);
                palavrasAtivas = cacheDicionarios[chave];

                atualizarMensagemListaCarregada(palavrasAtivas.length);
            } catch (erro) {
                console.error(erro);
                alert(`Arquivo "${config.arquivo}" não encontrado.`);
                palavrasAtivas = [];
                limparResultados();
            }
        }

        // Conta a frequência de caracteres em uma string/vetor
        function contarFrequencia(letras) {
            const map = {};
            for (let char of letras) {
                map[char] = (map[char] || 0) + 1;
            }
            return map;
        }

        function limparResultados() {
            elListaResultadosAgrupada.innerHTML = "";
            if (palavrasAtivas.length > 0) {
                atualizarMensagemListaCarregada(palavrasAtivas.length);
            } else {
                elContador.innerText = 'Aguardando busca...';
                elContador.className = 'bg-gray-100 text-gray-800 text-xs font-bold px-3 py-1.5 rounded-full';
            }
            
            const aviso = document.createElement('p');
            aviso.className = 'text-gray-400 text-sm italic text-center py-4';
            aviso.innerText = 'Digite as letras da roda acima e clique em "Decifrar Palavras".';
            elListaResultadosAgrupada.appendChild(aviso);
        }

        elIdioma.addEventListener('change', async (e) => {
            const chave = e.target.value;
            if (chave === 'custom') {
                elAreaUpload.classList.remove('hidden');
                await carregarDicionario('custom');
            } else {
                elAreaUpload.classList.add('hidden');
                await carregarDicionario(chave);
            }
            limparResultados();
        });

        elUploadFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                let linhas = event.target.result.split(/[\r\n]+/)
                    .map(l => l.trim().toLowerCase())
                    .filter(l => l.length > 0 && /^[a-zA-Záéíóúâêôãõçüàñäöüß-]+$/.test(l));

                const linhasLimitadas = linhas.slice(0, LIMITE_PALAVRAS);
                cacheDicionarios.custom = processarListaPalavras(linhasLimitadas);
                palavrasAtivas = [...cacheDicionarios.custom];
                
                atualizarMensagemListaCarregada(palavrasAtivas.length);
                limparResultados();
            };
            reader.readAsText(file);
        });

        // Evento de Tecla Enter
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const tag = e.target.tagName.toLowerCase();
                if (tag === 'input' || tag === 'select') {
                    e.preventDefault();
                    elBtnBuscar.click();
                }
            }
        });

        elBtnLimpar.addEventListener('click', () => {
            elLetrasDisponiveis.value = '';
            elPermitirRepeticao.checked = false;
            limparResultados();
            elLetrasDisponiveis.focus();
        });

        // LÓGICA DE FILTRAGEM DO WOW / ANAGRAMAS
        elBtnBuscar.addEventListener('click', () => {
            const entradaBruta = elLetrasDisponiveis.value.toLowerCase().replace(/[^a-záéíóúâêôãõçüàñäöüß]/g, '');
            const aceitarRepeticao = elPermitirRepeticao.checked;

            if (!entradaBruta) {
                alert("Por favor, digite pelo menos 2 ou 3 letras da sua roda.");
                return;
            }

            const letrasRodaArray = entradaBruta.split('');
            const freqRoda = contarFrequencia(letrasRodaArray);

            const filtradas = palavrasAtivas.filter(palavra => {
                // Remove acentos para comparação exata de caracteres da roda
                const palavraNorm = palavra.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
                
                // Mínimo 2 letras para o jogo WOW
                if (palavraNorm.length < 2) return false;

                const freqPalavra = contarFrequencia(palavraNorm.split(''));

                for (let char in freqPalavra) {
                    // 1. Se a palavra contém uma letra que NÃO existe na roda, descarte
                    if (!freqRoda[char]) return false;

                    // 2. Se a opção "Sem Repetição" está ativa, a frequência da letra na palavra
                    //    NÃO pode ser maior do que a frequência que veio na roda.
                    if (!aceitarRepeticao) {
                        if (freqPalavra[char] > freqRoda[char]) return false;
                    }
                }

                return true;
            });

            renderizarAgrupadoPorTamanho(filtradas);

            setTimeout(() => {
                window.scrollTo({
                    top: elPainelResultados.offsetTop - 15,
                    behavior: 'smooth'
                });
            }, 40);
        });

        // Renderiza agrupando por quantidade de letras (Estilo Bancadas do WOW)
        function renderizarAgrupadoPorTamanho(lista) {
            elListaResultadosAgrupada.innerHTML = "";

            if (lista.length === 0) {
                elContador.innerText = '0 palavras encontradas';
                elContador.className = 'bg-red-100 text-red-800 text-xs font-bold px-3 py-1.5 rounded-full';

                const aviso = document.createElement('p');
                aviso.className = 'text-gray-400 text-sm italic text-center py-4';
                aviso.innerText = 'Nenhuma palavra pode ser formada com essas letras.';
                elListaResultadosAgrupada.appendChild(aviso);
                return;
            }

            elContador.innerText = `${lista.length} palavras encontradas`;
            elContador.className = 'bg-purple-100 text-purple-800 text-xs font-bold px-3 py-1.5 rounded-full';

            // Agrupa por tamanho de palavra
            const grupos = {};
            lista.forEach(palavra => {
                const tam = palavra.length;
                if (!grupos[tam]) grupos[tam] = [];
                grupos[tam].push(palavra);
            });

            // Ordena os tamanhos do MAIOR para o MENOR (ex: 7 letras, 6 letras...)
            const tamanhosOrdenados = Object.keys(grupos).map(Number).sort((a, b) => b - a);

            const alertaCustom = document.getElementById('alerta-customizado');
            const alertaTextoCopia = document.getElementById('alerta-texto-copia');
            const alertaLinkDicionario = document.getElementById('alerta-link-dicionario');
            const configAtual = CONFIG_DICIONARIOS[chaveDicionarioAtual] || CONFIG_DICIONARIOS.pt;

            tamanhosOrdenados.forEach(tam => {
                const subBloco = document.createElement('div');
                subBloco.className = 'border-b pb-4 border-slate-100 last:border-0';

                const tituloTamanho = document.createElement('h3');
                tituloTamanho.className = 'text-sm font-bold text-purple-700 mb-2 flex items-center gap-2 uppercase tracking-wide';
                tituloTamanho.innerHTML = `<span>📌 Palavras de ${tam} Letras</span> <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md font-normal">(${grupos[tam].length})</span>`;
                
                const containerPuro = document.createElement('div');
                containerPuro.className = 'container-resultados-puro';

                const gridPura = document.createElement('div');
                gridPura.className = 'grid-resultados-puro';

                grupos[tam].forEach(palavra => {
                    const btn = document.createElement('div');
                    btn.className = 'botao-palavra-puro';
                    btn.innerText = palavra;

                    btn.addEventListener('click', () => {
                        navigator.clipboard.writeText(palavra);
                        
                        const urlDicionario = `${configAtual.dicionarioUrl}${encodeURIComponent(palavra)}`;
                        
                        alertaTextoCopia.innerText = `"${palavra.toUpperCase()}" copiada!`;
                        alertaLinkDicionario.href = urlDicionario;
                        alertaCustom.classList.remove('hidden');

                        clearTimeout(timeoutAlerta);
                        timeoutAlerta = setTimeout(() => { alertaCustom.classList.add('hidden'); }, 6000);
                    });

                    gridPura.appendChild(btn);
                });

                containerPuro.appendChild(gridPura);
                subBloco.appendChild(tituloTamanho);
                subBloco.appendChild(containerPuro);
                elListaResultadosAgrupada.appendChild(subBloco);
            });
        }

        // Carregamento inicial da página
        carregarDicionario('pt');
        limparResultados();
    </script>
</body>
</html>
