<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe Xpert (Reborn)</title>
  <style>
    body {
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      text-align: center;
      background-color: #f4f7f6;
      color: #333;
      margin: 20px;
    }

    h1 {
      color: dodgerblue;
      font-size: 25px;
      margin-bottom: 5px;
    }

    #title2 {
      color: orangered;
      font-size: 25px;
      margin-top: 0;
    }

    /* Container do Tabuleiro 3x3 */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 80px);
      grid-gap: 5px;
      justify-content: center;
      margin: 20px auto;
    }

    /* Estilo idêntico aos botões/campos originais */
    .cell {
      width: 80px;
      height: 52px;
      border: 2px solid gray;
      border-radius: 6px;
      font-size: 30px;
      font-weight: bold;
      text-align: center;
      background-color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .cell:hover {
      background-color: #eef6ff;
    }

    .cell.disabled {
      cursor: not-allowed;
    }

    /* Painel de Controles */
    .controls {
      margin: 15px auto;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    select, button {
      padding: 6px 12px;
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      font-size: 14px;
      border-radius: 4px;
    }

    #but_reset {
      box-sizing: border-box;
      height: 32px;
      border: 1px solid dodgerblue;
      background-color: dodgerblue;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #but_reset:hover {
      background-color: #0073e6;
    }

    /* Exibição de Status */
    #print {
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      color: dodgerblue;
      font-size: 18px;
      font-weight: bold;
      margin-top: 15px;
      min-height: 24px;
    }

    .info-panel {
      font-size: 12px;
      color: #666;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>TIC TAC TOE</h1>
  <h2 id="title2">XPERT</h2>

  <div class="grid-container">
    <div class="cell" id="b0" onclick="handleCellClick(0)"></div>
    <div class="cell" id="b1" onclick="handleCellClick(1)"></div>
    <div class="cell" id="b2" onclick="handleCellClick(2)"></div>
    <div class="cell" id="b3" onclick="handleCellClick(3)"></div>
    <div class="cell" id="b4" onclick="handleCellClick(4)"></div>
    <div class="cell" id="b5" onclick="handleCellClick(5)"></div>
    <div class="cell" id="b6" onclick="handleCellClick(6)"></div>
    <div class="cell" id="b7" onclick="handleCellClick(7)"></div>
    <div class="cell" id="b8" onclick="handleCellClick(8)"></div>
  </div>

  <div class="controls">
    <div>
      <label for="ai-level"><b>Nível da IA:</b> </label>
      <select id="ai-level" onchange="resetGame()">
        <option value="easy">Easy (Aleatório)</option>
        <option value="piece_of_cake">Piece of Cake</option>
        <option value="expert">Expert</option>
        <option value="daniel_san">Daniel San</option>
        <option value="miyagi">Miyagi</option>
        <option value="ninja">Ninja</option>
        <option value="jedi">Jedi</option>
        <option value="yoda" selected>Yoda (Invencível - Defensivo)</option>
        <option value="darth_vader">Darth Vader (Invencível - Agressivo)</option>
      </select>
    </div>

    <div>
      <label for="player-symbol"><b>Você joga com:</b> </label>
      <select id="player-symbol" onchange="resetGame()">
        <option value="X" selected>X (Primeiro)</option>
        <option value="O">O (Segundo)</option>
      </select>
    </div>

    <button id="but_reset" onclick="resetGame()">REINICIAR</button>
  </div>

  <p id="print"></p>

  <div class="info-panel">
    <p>Histórico de Jogadas: <span id="history-str">-</span></p>
  </div>

  <script>
    /* ==========================================================================
       ENGINE LOGIC (Motor do Jogo da Velha sem dependências com DOM)
       ========================================================================== */
    class TicTacToeEngine {
      constructor() {
        this.WINNING_COMBOS = [
          [0, 1, 2], [3, 4, 5], [6, 7, 8], // Linhas
          [0, 3, 6], [1, 4, 7], [2, 5, 8], // Colunas
          [0, 4, 8], [2, 4, 6]             // Diagonais
        ];
        this.reset();
      }

      reset() {
        this.board = Array(9).fill(null);
        this.history = [];
        this.currentPlayer = 'X';
        this.isGameOver = false;
        this.winner = null;
      }

      get gameHistoryStr() {
        return this.history.join('');
      }

      getAvailableMoves(board = this.board) {
        const moves = [];
        for (let i = 0; i < 9; i++) {
          if (board[i] === null) moves.push(i);
        }
        return moves;
      }

      makeMove(index) {
        if (this.board[index] !== null || this.isGameOver) return false;

        this.board[index] = this.currentPlayer;
        this.history.push(index);

        if (this.checkWin(this.board, this.currentPlayer)) {
          this.isGameOver = true;
          this.winner = this.currentPlayer;
        } else if (this.getAvailableMoves().length === 0) {
          this.isGameOver = true;
          this.winner = 'TIE';
        } else {
          this.currentPlayer = this.currentPlayer === 'X' ? 'O' : 'X';
        }
        return true;
      }

      checkWin(board, player) {
        return this.WINNING_COMBOS.some(combo =>
          combo.every(index => board[index] === player)
        );
      }

      /* ==========================================================================
         SISTEMA MINIMAX COM PERSONALIDADES (Yoda vs Darth Vader)
         ========================================================================== */
      minimax(board, depth, isMaximizing, aiPlayer, humanPlayer) {
        if (this.checkWin(board, aiPlayer)) return 10 - depth;
        if (this.checkWin(board, humanPlayer)) return depth - 10;
        
        const availableMoves = this.getAvailableMoves(board);
        if (availableMoves.length === 0) return 0;

        if (isMaximizing) {
          let bestScore = -Infinity;
          for (let move of availableMoves) {
            board[move] = aiPlayer;
            let score = this.minimax(board, depth + 1, false, aiPlayer, humanPlayer);
            board[move] = null;
            bestScore = Math.max(score, bestScore);
          }
          return bestScore;
        } else {
          let bestScore = Infinity;
          for (let move of availableMoves) {
            board[move] = humanPlayer;
            let score = this.minimax(board, depth + 1, true, aiPlayer, humanPlayer);
            board[move] = null;
            bestScore = Math.min(score, bestScore);
          }
          return bestScore;
        }
      }

      getBestMove(aiPlayer, personality = 'yoda') {
        const humanPlayer = aiPlayer === 'X' ? 'O' : 'X';
        const availableMoves = this.getAvailableMoves();
        
        if (availableMoves.length === 0) return null;

        let bestScore = -Infinity;
        let moveEvaluations = [];

        for (let move of availableMoves) {
          this.board[move] = aiPlayer;
          let score = this.minimax(this.board, 0, false, aiPlayer, humanPlayer);
          this.board[move] = null;

          moveEvaluations.push({ move, score });
          if (score > bestScore) bestScore = score;
        }

        // Filtra apenas as jogadas de maior pontuação matemática
        const topMoves = moveEvaluations.filter(e => e.score === bestScore);

        if (personality === 'darth_vader') {
          // DARTH VADER (Agressivo): Prioriza centro (4) e cantos (0,2,6,8) para criar armadilhas
          const aggressiveOrder = [4, 0, 2, 6, 8, 1, 3, 5, 7];
          topMoves.sort((a, b) => aggressiveOrder.indexOf(a.move) - aggressiveOrder.indexOf(b.move));
          return topMoves[0].move;
        } else {
          // YODA (Defensivo / Equilibrado): Sorteia aleatoriamente entre as melhores jogadas
          const randomIndex = Math.floor(Math.random() * topMoves.length);
          return topMoves[randomIndex].move;
        }
      }

      getAIMoveByLevel(level, aiPlayer) {
        const availableMoves = this.getAvailableMoves();
        const getRandomMove = () => availableMoves[Math.floor(Math.random() * availableMoves.length)];

        switch (level) {
          case 'easy':
            return getRandomMove();

          case 'piece_of_cake':
            return Math.random() < 0.2 ? this.getBestMove(aiPlayer, 'yoda') : getRandomMove();

          case 'expert':
            return Math.random() < 0.4 ? this.getBestMove(aiPlayer, 'yoda') : getRandomMove();

          case 'daniel_san':
            return Math.random() < 0.6 ? this.getBestMove(aiPlayer, 'yoda') : getRandomMove();

          case 'miyagi':
            return Math.random() < 0.75 ? this.getBestMove(aiPlayer, 'yoda') : getRandomMove();

          case 'ninja':
            return Math.random() < 0.88 ? this.getBestMove(aiPlayer, 'yoda') : getRandomMove();

          case 'jedi':
            return Math.random() < 0.95 ? this.getBestMove(aiPlayer, 'yoda') : getRandomMove();

          case 'yoda':
            return this.getBestMove(aiPlayer, 'yoda');

          case 'darth_vader':
            return this.getBestMove(aiPlayer, 'darth_vader');

          default:
            return this.getBestMove(aiPlayer, 'yoda');
        }
      }
    }

    /* ==========================================================================
       INTEGRAÇÃO COM A INTERFACE E EVENTOS DO DOM
       ========================================================================== */
    const engine = new TicTacToeEngine();

    function updateUI() {
      // Atualiza o tabuleiro visual
      for (let i = 0; i < 9; i++) {
        const cell = document.getElementById(`b${i}`);
        cell.innerText = engine.board[i] || '';
        if (engine.board[i] !== null || engine.isGameOver) {
          cell.classList.add('disabled');
        } else {
          cell.classList.remove('disabled');
        }
      }

      // Atualiza mensagens de status
      const printEl = document.getElementById('print');
      const playerSymbol = document.getElementById('player-symbol').value;

      if (engine.isGameOver) {
        if (engine.winner === 'TIE') {
          printEl.innerText = 'Empate! Deu Velha!';
          printEl.style.color = 'orangered';
        } else {
          const winnerText = engine.winner === playerSymbol ? 'Você Venceu!' : 'A IA Venceu!';
          printEl.innerText = winnerText;
          printEl.style.color = engine.winner === playerSymbol ? 'dodgerblue' : 'red';
        }
      } else {
        printEl.innerText = `Vez do jogador: ${engine.currentPlayer}`;
        printEl.style.color = 'dodgerblue';
      }

      // Histórico
      document.getElementById('history-str').innerText = engine.gameHistoryStr || '-';
    }

    function checkAndTriggerAIMove() {
      const playerSymbol = document.getElementById('player-symbol').value;
      const aiSymbol = playerSymbol === 'X' ? 'O' : 'X';

      if (!engine.isGameOver && engine.currentPlayer === aiSymbol) {
        const level = document.getElementById('ai-level').value;
        setTimeout(() => {
          const aiMove = engine.getAIMoveByLevel(level, aiSymbol);
          if (aiMove !== null && aiMove !== undefined) {
            engine.makeMove(aiMove);
            updateUI();
          }
        }, 250); // Delay suave de resposta
      }
    }

    function handleCellClick(index) {
      const playerSymbol = document.getElementById('player-symbol').value;

      if (engine.isGameOver || engine.currentPlayer !== playerSymbol) return;

      if (engine.makeMove(index)) {
        updateUI();
        checkAndTriggerAIMove();
      }
    }

    function resetGame() {
      engine.reset();
      updateUI();
      checkAndTriggerAIMove();
    }

    // Inicialização ao carregar a página
    window.onload = () => {
      resetGame();
    };
  </script>
</body>
</html>
