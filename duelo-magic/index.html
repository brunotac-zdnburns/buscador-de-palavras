<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duelo Mágico - Animações em ASCII</title>
  <style>
    /* Variáveis CSS para permitir a troca dinâmica de cores */
    :root {
      --bg-color: #000000;
      --fg-color: #00ff00;
    }

    body {
      background-color: var(--bg-color);
      color: var(--fg-color);
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      transition: background-color 0.3s, color 0.3s;
    }

    .painel-controles {
      background: rgba(255, 255, 255, 0.05);
      padding: 15px 25px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--fg-color);
      width: 100%;
      max-width: 800px;
    }

    .btn {
      background-color: transparent;
      color: var(--fg-color);
      border: 1px solid var(--fg-color);
      padding: 8px 16px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      text-decoration: none;
      transition: all 0.2s;
      border-radius: 4px;
    }

    .btn:hover:not(:disabled) {
      background-color: var(--fg-color);
      color: var(--bg-color);
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .color-picker {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
    }

    input[type="color"] {
      border: 1px solid var(--fg-color);
      width: 35px;
      height: 35px;
      padding: 0;
      background: transparent;
      cursor: pointer;
      border-radius: 4px;
    }

    .inputs-jogadores input {
      background: transparent;
      color: var(--fg-color);
      border: 1px dashed var(--fg-color);
      padding: 5px;
      font-family: inherit;
      font-weight: bold;
      text-align: center;
      width: 120px;
    }

    .tela-terminal {
      background-color: var(--bg-color);
      border: 2px solid var(--fg-color);
      padding: 20px;
      width: 600px;
      height: 400px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.1); /* Brilho sutil */
    }

    pre {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="painel-controles">
    <a href="../" class="btn">⬅ Voltar para o Hub</a>
    
    <div class="color-picker">
      <label for="bgColor">Cor do Fundo:</label>
      <input type="color" id="bgColor" value="#000000">
    </div>
    <div class="color-picker">
      <label for="fgColor">Cor do Texto:</label>
      <input type="color" id="fgColor" value="#00ff00">
    </div>

    <div class="inputs-jogadores">
      <input type="text" id="nome1" value="JOGADOR 1">
      <span style="margin: 0 10px; font-weight: bold;">VS</span>
      <input type="text" id="nome2" value="JOGADOR 2">
    </div>
  </div>

  <div class="painel-controles" id="action-buttons">
    <button class="btn" onclick="iniciarAnimacao('vitoriaEsq')">Vitória Esq. (Ataque)</button>
    <button class="btn" onclick="iniciarAnimacao('vitoriaDir')">Vitória Dir. (Reflexo)</button>
    <button class="btn" onclick="iniciarAnimacao('empate')">Empate (Colisão)</button>
    <button class="btn" onclick="iniciarAnimacao('ambosMorrem')">Ambos Morrem</button>
  </div>

  <div class="tela-terminal">
    <pre id="display"></pre>
  </div>

  <script>
    // --- GERENCIAMENTO DE CORES ---
    const bgColorInput = document.getElementById('bgColor');
    const fgColorInput = document.getElementById('fgColor');
    const rootStyles = document.documentElement.style;
    
    bgColorInput.addEventListener('input', (e) => rootStyles.setProperty('--bg-color', e.target.value));
    fgColorInput.addEventListener('input', (e) => rootStyles.setProperty('--fg-color', e.target.value));

    // --- MOTOR DO TERMINAL (Estilo Pascal/CRT) ---
    const display = document.getElementById('display');
    const cols = 60;
    const rows = 20;
    let buffer = [];
    let isAnimating = false;

    // Função Delay (equivalente ao delay() do Pascal)
    const delay = (ms) => new Promise(res => setTimeout(res, ms));

    function limparTela() {
      buffer = Array(rows).fill().map(() => Array(cols).fill(' '));
      renderizar();
    }

    function renderizar() {
      display.textContent = buffer.map(row => row.join('')).join('\n');
    }

    function gotoxy(x, y, text) {
      if (y >= 0 && y < rows) {
        for (let i = 0; i < text.length; i++) {
          if (x + i >= 0 && x + i < cols) {
            buffer[y][x + i] = text[i];
          }
        }
      }
    }

    // --- SPRITES ASCII ---
    function desenharMagoEsq(x, y, pose = 0) {
      if (pose === 0) { // Normal
        gotoxy(x, y,   "  O  ");
        gotoxy(x, y+1, " /|\\~");
        gotoxy(x, y+2, " / \\ ");
      } else if (pose === 1) { // Lançando magia
        gotoxy(x, y,   "  O  ");
        gotoxy(x, y+1, " \\|/-");
        gotoxy(x, y+2, " / \\ ");
      } else if (pose === 2) { // Túmulo / Cinzas
        gotoxy(x, y,   "     ");
        gotoxy(x, y+1, "  _|_");
        gotoxy(x, y+2, " .....");
      }
    }

    function desenharMagoDir(x, y, pose = 0) {
      if (pose === 0) { // Normal
        gotoxy(x, y,   "  O  ");
        gotoxy(x, y+1, "~/|\\ ");
        gotoxy(x, y+2, " / \\ ");
      } else if (pose === 1) { // Defendendo / Refletindo
        gotoxy(x, y,   " |O| ");
        gotoxy(x, y+1, " |/|\\");
        gotoxy(x, y+2, " |/ \\");
      } else if (pose === 2) { // Túmulo / Cinzas
        gotoxy(x, y,   "     ");
        gotoxy(x, y+1, "  _|_");
        gotoxy(x, y+2, " .....");
      }
    }

    // --- LÓGICA DAS ANIMAÇÕES ---
    function setBotoesState(estado) {
      const botoes = document.querySelectorAll('#action-buttons button');
      botoes.forEach(b => b.disabled = !estado);
    }

    async function iniciarAnimacao(tipo) {
      if (isAnimating) return;
      isAnimating = true;
      setBotoesState(false);

      const nome1 = (document.getElementById('nome1').value || "JOGADOR 1").toUpperCase();
      const nome2 = (document.getElementById('nome2').value || "JOGADOR 2").toUpperCase();

      limparTela();
      
      // Header com Nomes
      gotoxy(cols/2 - 1, 2, "VS");
      gotoxy(4, 2, nome1.substring(0, 15));
      gotoxy(cols - 18, 2, nome2.substring(0, 15));

      const y = 10;
      const xEsq = 5;
      const xDir = 45;

      // 1. Apresentação (Standby)
      desenharMagoEsq(xEsq, y, 0);
      desenharMagoDir(xDir, y, 0);
      renderizar();
      await delay(800);

      // 2. Execução Baseada no Cenário Escolhido
      if (tipo === 'vitoriaEsq') {
        desenharMagoEsq(xEsq, y, 1);
        for(let i = xEsq + 6; i < xDir; i++) {
          gotoxy(i - 1, y + 1, " ");
          gotoxy(i, y + 1, ">>>");
          renderizar();
          await delay(40);
        }
        gotoxy(xDir - 1, y + 1, "   ");
        desenharMagoDir(xDir, y, 2); // Oponente Vira Cinzas
        gotoxy(cols/2 - Math.floor((nome1.length + 8) / 2), 16, `${nome1} VENCEU!`);
        renderizar();
      } 
      else if (tipo === 'vitoriaDir') {
        desenharMagoEsq(xEsq, y, 1);
        for(let i = xEsq + 6; i < xDir - 2; i++) {
          gotoxy(i - 1, y + 1, " ");
          gotoxy(i, y + 1, "~~~");
          renderizar();
          await delay(40);
        }
        // Direita levanta escudo e reflete
        desenharMagoDir(xDir, y, 1);
        gotoxy(xDir - 3, y + 1, "||"); 
        renderizar();
        await delay(300);
        
        for(let i = xDir - 4; i > xEsq + 3; i--) {
          gotoxy(i + 1, y + 1, "   ");
          gotoxy(i, y + 1, "<=<");
          renderizar();
          await delay(40);
        }
        gotoxy(xEsq + 4, y + 1, "   ");
        desenharMagoEsq(xEsq, y, 2); // Esquerda morre com o próprio ataque
        desenharMagoDir(xDir, y, 0); // Direita relaxa
        gotoxy(cols/2 - Math.floor((nome2.length + 8) / 2), 16, `${nome2} VENCEU!`);
        renderizar();
      }
      else if (tipo === 'empate') {
        desenharMagoEsq(xEsq, y, 1);
        desenharMagoDir(xDir, y, 1); // Ambos atacam
        let projEsq = xEsq + 6;
        let projDir = xDir - 2;
        while (projEsq < projDir) {
          gotoxy(projEsq - 1, y + 1, " ");
          gotoxy(projEsq, y + 1, ">>");
          gotoxy(projDir + 2, y + 1, " ");
          gotoxy(projDir, y + 1, "<<");
          renderizar();
          await delay(50);
          projEsq++;
          projDir--;
        }
        // Explosão domo de energia no meio
        gotoxy(projEsq - 2, y,   " \\|/ ");
        gotoxy(projEsq - 2, y + 1, "-(O)-");
        gotoxy(projEsq - 2, y + 2, " /|\\ ");
        renderizar();
        await delay(600);
        
        gotoxy(projEsq - 2, y,   "     ");
        gotoxy(projEsq - 2, y + 1, "     ");
        gotoxy(projEsq - 2, y + 2, "     ");
        desenharMagoEsq(xEsq, y, 0); // Voltam ao normal
        desenharMagoDir(xDir, y, 0);
        gotoxy(cols/2 - 4, 16, "EMPATE!");
        renderizar();
      }
      else if (tipo === 'ambosMorrem') {
        desenharMagoEsq(xEsq, y, 1);
        desenharMagoDir(xDir, y, 1); // Ambos lançam super-ataques que se ignoram
        
        for(let i = 0; i < 35; i++) {
          let posEsq = xEsq + 6 + i;
          let posDir = xDir - 1 - i;
          if(posEsq < cols) gotoxy(posEsq, y + 1, "->");
          if(posDir > 0) gotoxy(posDir, y + 1, "<-");
          renderizar();
          await delay(30);
          if(posEsq < cols) gotoxy(posEsq, y + 1, "  ");
          if(posDir > 0) gotoxy(posDir, y + 1, "  ");
        }
        
        // Explosões diretas nos Magos
        gotoxy(xEsq, y,   " \\|/ ");
        gotoxy(xEsq, y+1, "-(O)-");
        gotoxy(xEsq, y+2, " /|\\ ");
        
        gotoxy(xDir, y,   " \\|/ ");
        gotoxy(xDir, y+1, "-(O)-");
        gotoxy(xDir, y+2, " /|\\ ");
        renderizar();
        await delay(500);
        
        desenharMagoEsq(xEsq, y, 2); // Ambos viram túmulo/cinzas
        desenharMagoDir(xDir, y, 2);
        gotoxy(cols/2 - 8, 16, "MÚTUA DESTRUIÇÃO!");
        renderizar();
      }

      isAnimating = false;
      setBotoesState(true);
    }

    // --- TELA DE BOOT INICIAL ---
    limparTela();
    gotoxy(cols/2 - 15, 8, "PREPARE-SE PARA O DUELO MÁGICO!");
    gotoxy(cols/2 - 12, 10, "Aguardando combatentes...");
    renderizar();

  </script>
</body>
</html>
